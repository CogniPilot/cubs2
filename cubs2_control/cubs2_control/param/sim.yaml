# --- Longitudinal TECS Outer Loop (Energy Control) ---
K_thrustp: 0.2
K_thrusti: 0.35
K_pitchp: 0.5
K_pitchi: 0.316
norm_Es_dot_integral_max: 7.5
dist_term_integral_max: 7.5

# --- Longitudinal TECS Inner Loop (Pitch & Throttle) ---
K_elevp: 0.37
K_elevi: 0.27
K_q: 0.2
K_phi_elev: 2.5
pitch_integral_max: 0.3
r_integral_max: 0.4

# --- Trim Values ---
trim_thrust: 2.5
trim_aileron: 0.0
trim_elevator: 0.1
trim_throttle: 0.0
trim_rudder: 0.0

# --- L1 Guidance (lateral outer loop) ---
# L1_dist: lookahead distance [m].
L1_dist: 5.0

# --- Coordinated Turn (rudder) ---
# K_rud_coord: proportional gain on yaw-rate error for β≈0 coordination.
K_rud_coord: 0.15

# --- Lateral Loop (Heading Control) --- [kept for 'direct' roll_mode fallback]
K_deltap: 0.25
K_deltai: 0.10
K_deltad: 0.0

# --- Speed Reference Feedthrough ---
K_V: 2.0 # gain to convert speed error (m/s) to acceleration command (m/s²)

# --- Feedforward blend weights (lateral phi + longitudinal gamma) ---
# Manages the proportion of feedforward vs feedback in the control law.
K_phi_fb:   1.0
K_phi_ff:   1.0
K_gamma_fb: 0.8
K_gamma_ff: 0.2

# --- Vehicle Parameters ---
mass: 0.057

# --- Lateral Roll Control (Stabilized Mode) ---
k_chi: 1.20               # [1/s] maps heading error -> desired heading rate
k_chi_d: 0.00             # [1] derivative damping on heading rate
fc_chi: 10.0               # [Hz] chi-dot low-pass cutoff
phi_lim_deg: 40.0         # bank limit
phi_dot_lim_deg_s: 90.0   # optional slew on bank [deg/s]
chi_deadband_deg: 1.0     # heading error deadband to fix oscillations [deg]
K_phi_p: 3.0              # aileron per rad (P on roll error)
K_phi_i: 1.6              # aileron per rad·s (I on roll error)
K_phi_d: 0.8              # aileron per (rad/s) (D on roll rate)
i_phi_max: 0.63
da_max: 1.0
